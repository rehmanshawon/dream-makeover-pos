appId: com.dreammakeover.pos
productName: Dream Makeover POS
directories:
  output: desktop/release
files:
  - desktop/dist/**/*
  - frontend/dist/**/*
  - desktop/package.json
  - package.json
  - '!**/*.map'
extraResources:
  - from: desktop/installer-resources/backend
    to: backend
    filter:
      - '**/*'
  - from: desktop/installer-resources/runtime-deps
    to: node_modules
    filter:
      - '**/*'
  - from: desktop/installer-resources/mysql
    to: mysql
    filter:
      - '**/*'
extraMetadata:
  main: desktop/dist/index.js
win:
  icon: frontend/public/logo.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  license: desktop/installer-license.txt
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
